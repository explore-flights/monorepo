name: 'Build API application image'

on:
  workflow_call:
    outputs:
      image:
        description: 'Application image repository'
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: 'Application image manifest digest'
        value: ${{ jobs.build.outputs.digest }}

permissions:
  contents: read
  packages: write

concurrency:
  group: 'build-api-application-image-${{ github.ref }}'
  cancel-in-progress: false

jobs:
  build:
    name: 'Build application image'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7

      - name: 'Prepare image tag'
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/explore-flights-api-application"
          {
            echo "name=${image}"
            echo "tag=${image}:sha-${GITHUB_SHA}"
          } >> "${GITHUB_OUTPUT}"

      - name: 'Login to GHCR'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Set up QEMU'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: 'Set up Docker Buildx'
        uses: docker/setup-buildx-action@v4

      - name: 'Build and push application image'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: go/api/Dockerfile.application
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=api-application
          cache-to: type=gha,mode=max,scope=api-application
