name: 'Update API images'

on:
  workflow_dispatch:
    inputs:
      environments:
        description: 'JSON list of environments to update'
        required: true
        type: string
        default: '["beta", "prod"]'

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  validate:
    name: 'Validate environments'
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.environments.outputs.value }}
    steps:
      - name: 'Validate environment list'
        id: environments
        env:
          ENVIRONMENTS: ${{ inputs.environments }}
        run: |
          environments="$(jq -ce '
            if type != "array" or length == 0 then
              error("environments must be a non-empty JSON array")
            elif any(.[]; type != "string" or (. != "beta" and . != "prod")) then
              error("environments may contain only beta and prod")
            elif (unique | length) != length then
              error("environments must not contain duplicates")
            else
              .
            end
          ' <<<"${ENVIRONMENTS}")"

          echo "value=${environments}" >> "${GITHUB_OUTPUT}"

  deploy:
    name: 'Deploy ${{ matrix.environment }} API image'
    needs:
      - validate
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.validate.outputs.environments) }}
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/deploy-api-image.yml
    with:
      environment: ${{ matrix.environment }}
    secrets: inherit
